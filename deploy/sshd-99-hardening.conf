# /etc/ssh/sshd_config.d/99-hardening.conf
#
# 적용 전 반드시 확인: 현재 로그인 계정의 ~/.ssh/authorized_keys 에 공개키가 등록되어 있고,
# 그 키로 접속이 되는지 별도 세션에서 검증한 뒤 `sudo systemctl restart ssh`.
# GCP 는 OS Login 또는 메타데이터 SSH 키로 authorized_keys 를 관리하므로 보통 이미 키 인증 상태다.

# [방어] 비밀번호 무차별 대입 자체를 불가능하게: 키 인증만 허용
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
PermitEmptyPasswords no

# [방어] root 직접 로그인 차단 (sudo 로만 권한 상승)
PermitRootLogin no

# [방어] 시도 횟수/시간 제한
MaxAuthTries 3
MaxSessions 5
LoginGraceTime 30

# [방어] 불필요한 기능 비활성화 (앱 서버에서는 포워딩/X11 불필요)
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no

# 세션 유지/정리
ClientAliveInterval 300
ClientAliveCountMax 2

# 로그 상세도
LogLevel VERBOSE

# 특정 계정만 SSH 허용하려면 주석 해제 후 계정명 지정 (GCP 계정명으로)
# AllowUsers your_gcp_username
