# /etc/nginx/sites-available/memo  ->  ln -s 로 sites-enabled 에 연결
#
# Cloudflare(프록시) -> nginx(443, Origin CA 인증서) -> gunicorn(127.0.0.1:8000)
# 80 포트는 열지 않는다. HTTP -> HTTPS 리다이렉트는 Cloudflare 가 처리한다.

# Cloudflare 가 넘겨주는 실제 클라이언트 IP 복원. 이 파일은 deploy/cloudflare-allowlist.sh 가 생성한다.
# [방어] 실제 IP 를 정확히 알아야 앱의 로그인 rate limit 이 "Cloudflare IP 전체" 가 아니라 공격자 IP 단위로 걸린다
include /etc/nginx/cloudflare-realip.conf;

# 로그인/가입 경로에 대한 nginx 단 요청 제한 (앱 내부 제한과 이중)
limit_req_zone $remote_addr zone=memo_auth:10m rate=30r/m;
limit_req_zone $remote_addr zone=memo_all:10m rate=300r/m;
limit_conn_zone $remote_addr zone=memo_conn:10m;

# [방어] Host 헤더가 도메인이 아닌 요청(직접 IP 접근, 스캐너)은 연결을 그냥 끊는다
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/ssl/memo/origin.pem;
    ssl_certificate_key /etc/ssl/memo/origin.key;
    return 444;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name sbfmt.shop www.sbfmt.shop;

    # Cloudflare Origin CA 인증서 (Cloudflare 대시보드 > SSL/TLS > Origin Server 에서 발급)
    ssl_certificate     /etc/ssl/memo/origin.pem;
    ssl_certificate_key /etc/ssl/memo/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:memo_ssl:5m;
    ssl_session_tickets off;

    # [방어] Authenticated Origin Pulls: Cloudflare 만 TLS 클라이언트 인증서로 접속 가능. IP 스푸핑/방화벽 실수까지 방어.
    # Cloudflare 대시보드에서 기능을 켠 뒤 아래 두 줄 주석 해제.
    # 인증서: https://developers.cloudflare.com/ssl/origin-configuration/authenticated-origin-pull/set-up/zone-level/
    # ssl_client_certificate /etc/ssl/memo/authenticated_origin_pull_ca.pem;
    # ssl_verify_client on;

    # [방어] 버전 노출 차단
    server_tokens off;

    # [방어] 대용량 요청 차단 (앱의 MAX_CONTENT_LENGTH 32KB 보다 약간 큼)
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_conn memo_conn 20;

    access_log /var/log/nginx/memo.access.log;
    error_log  /var/log/nginx/memo.error.log warn;

    # [방어] .git, .env 등 점으로 시작하는 경로 요청은 앱까지 가지 않고 차단
    location ~ /\. {
        deny all;
        return 404;
    }

    location = /login {
        limit_req zone=memo_auth burst=10 nodelay;
        include /etc/nginx/snippets/memo-proxy.conf;
    }

    location = /register {
        limit_req zone=memo_auth burst=10 nodelay;
        include /etc/nginx/snippets/memo-proxy.conf;
    }

    location / {
        limit_req zone=memo_all burst=50 nodelay;
        include /etc/nginx/snippets/memo-proxy.conf;
    }
}
